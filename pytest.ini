[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -q
filterwarnings =
    # SQLAlchemy's SQLite dialect stores DECIMAL as NUMERIC, so the value comes
    # back through a float. Reading is safe (SQLAlchemy coerces to Decimal via
    # str()), but tests must never *write* a float to a money column.
    ignore::sqlalchemy.exc.SAWarning
